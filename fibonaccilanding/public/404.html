<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">

<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; text-align: center;
    background: radial-gradient(120% 80% at 15% 0%,#2B2F9E 0%,#181B4F 45%,#0B0E24 100%);
    color: #C9CDE8; font-family: 'Golos Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { padding: clamp(24px,6vw,60px); max-width: 620px; }
  .code { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(64px,16vw,130px);
    line-height: 1; color: #fff; margin: 0; letter-spacing: .02em; }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase;
    font-size: clamp(20px,3.4vw,30px); line-height: 1.15; margin: 10px 0 0; color: #fff; }
  p { font-size: 16px; line-height: 1.6; margin: 14px 0 0; color: #A6ABC8; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 26px;
    border-radius: 999px; font-size: 16px; font-weight: 600; text-decoration: none; }
  .primary { background: #fff; color: #12142E; }
  .ghost { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28); color: #fff; }
  a.btn:focus-visible { outline: 2px solid #8E7BFF; outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, адрес изменился или страница была удалена.</p>
  <div class="row">
    <a class="btn primary" href="/">На главную</a>
    <a class="btn ghost" href="https://t.me/Fibonacci_presentation_bot">Создать в Telegram</a>
  </div>
</div>
</body></html>
